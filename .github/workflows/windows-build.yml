name: Build (Windows)

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面一键手动触发
    inputs:
      version:
        description: '发布版本号 (如 3.0.3)'
        required: false
        default: '3.0.3'
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install protobuf
        run: |
          choco install protoc
          echo "C:\ProgramData\chocolatey\lib\protoc\tools" >> $env:GITHUB_PATH

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.event.inputs.version || '3.0.3' }}
          releaseName: 'DTV ${{ github.event.inputs.version || '3.0.3' }}'
          args: --ignore-version-mismatches # 忽略插件小版本轻微漂移

      # 关键优化：无论是否打 Tag/发布 Release，都将安装包上传为 GitHub Artifact，随时直接下载
      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: DTV-Windows-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
