name: Build (Windows)

permissions:
  contents: write
  packages: write
  actions: read

on:
  push:
    branches:
      - main       # 允许直接 push 到 main 触发构建，产生运行记录（避免显示“没有 runs”）
    tags:
      - 'v*.*.*'
      - '*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0 or 1.0)'
        required: false
        default: 'manual'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 官方原版环境依赖
      - name: Install protobuf (Windows)
        run: |
          choco install protoc
          echo "C:\ProgramData\chocolatey\lib\protoc\tools" >> $env:GITHUB_PATH

      - name: Install OpenSSL build prerequisites (Windows)
        run: |
          choco install strawberryperl nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
          echo "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH

      - name: Set rusty_v8 archive (Windows)
        run: |
          echo "RUSTY_V8_ARCHIVE=https://github.com/denoland/rusty_v8/releases/download/v0.93.1/rusty_v8_release_x86_64-pc-windows-msvc.lib.gz" >> $env:GITHUB_ENV

      - name: Patch tauri config for Windows build
        shell: powershell
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content -Path $path -Raw -Encoding utf8 | ConvertFrom-Json
          if ($null -ne $json.app -and $null -ne $json.app.windows -and $json.app.windows.Count -gt 0) {
            $win0 = $json.app.windows[0]
            $win0 | Add-Member -NotePropertyName decorations -NotePropertyValue $false -Force
          }
          $raw = $json | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText($path, $raw, [System.Text.UTF8Encoding]::new($false))

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

        
            # 官方原版 Tauri Action 调用（不改动任何编译参数）
      - name: Build the app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTY_V8_MIRROR: https://github.com/denoland/rusty_v8/releases/download
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'DTV ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## 🎉 DTV Release ${{ github.event.inputs.version || github.ref_name }}
            
            ### 📦 安装包下载
            - **Windows**: DTV_${{ github.event.inputs.version || github.ref_name }}_x64-setup.exe
            
            ### 🔧 安装说明
            - **Windows**: 下载 .exe 文件，右键以管理员身份运行
          releaseDraft: false
          prerelease: false

      # 仅遍历 dtv.exe 并在日志打印路径，已知位置的两个安装包直接复制
      - name: Prepare distribution files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 仅递归遍历 target 查找 release 阶段生成的 dtv.exe，并在日志中明确显示其路径
          $exeFile = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "dtv.exe" | Where-Object { $_.FullName -notmatch "build" -and $_.FullName -notmatch "incremental" } | Select-Object -First 1
          if ($exeFile) {
            Write-Host "=========================================="
            Write-Host "Found dtv.exe at path: $($exeFile.FullName)"
            Write-Host "=========================================="
            Copy-Item $exeFile.FullName -Destination dist/ -Force
          } else {
            Write-Error "dtv.exe not found under src-tauri/target!"
            exit 1
          }

          # 从已知确定位置直接复制已生成的 NSIS 和 MSI 安装包
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/ -Force
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist/ -Force

      # 将免安装的 dtv.exe 追加上传到 GitHub Release（单文件原名直链发布）
      - name: Upload standalone dtv.exe to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.version || github.ref_name }} dist/dtv.exe --clobber

      # 将 3 个平铺好的原名文件上传为 Artifact
      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: DTV-Windows-Installers
          path: dist/*
          if-no-files-found: error
